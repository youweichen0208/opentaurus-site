<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F4EFE6"/>
  <rect x="70" y="70" width="1460" height="760" rx="28" fill="#FFF9F1" stroke="#D7C7AF" stroke-width="4"/>
  <text x="120" y="145" fill="#42372A" font-size="44" font-family="Georgia, serif">Recycle Bin Recovery Setup</text>
  <text x="120" y="190" fill="#7A6A55" font-size="24" font-family="Arial, sans-serif">Create table, insert sample rows, drop it on purpose, then restore through confirmation token.</text>

  <rect x="120" y="260" width="360" height="340" rx="22" fill="#FCE8C6" stroke="#DAAD5B" stroke-width="3"/>
  <text x="150" y="320" fill="#4B3820" font-size="30" font-family="Arial, sans-serif">1. Create + Insert</text>
  <rect x="150" y="350" width="300" height="200" rx="14" fill="#FFF7E8" stroke="#E7C88E"/>
  <text x="172" y="390" fill="#5C4831" font-size="22" font-family="Courier New, monospace">t_recycle_bin_test</text>
  <text x="172" y="430" fill="#5C4831" font-size="20" font-family="Courier New, monospace">id | order_no | status</text>
  <text x="172" y="468" fill="#5C4831" font-size="20" font-family="Courier New, monospace">1  | rb-001   | paid</text>
  <text x="172" y="506" fill="#5C4831" font-size="20" font-family="Courier New, monospace">2  | rb-002   | pending</text>
  <text x="172" y="544" fill="#5C4831" font-size="20" font-family="Courier New, monospace">3  | rb-003   | paid</text>

  <rect x="620" y="260" width="360" height="340" rx="22" fill="#F8DDD6" stroke="#CF7D66" stroke-width="3"/>
  <text x="650" y="320" fill="#4B3820" font-size="30" font-family="Arial, sans-serif">2. Drop Table</text>
  <rect x="660" y="372" width="280" height="130" rx="16" fill="#FFF4F1" stroke="#E3A998"/>
  <text x="704" y="447" fill="#8C4C3A" font-size="34" font-family="Courier New, monospace">DROP TABLE</text>
  <text x="650" y="548" fill="#7A5146" font-size="22" font-family="Arial, sans-serif">Object is intentionally pushed into recycle bin.</text>

  <rect x="1120" y="260" width="360" height="340" rx="22" fill="#DDEDDC" stroke="#7EA57B" stroke-width="3"/>
  <text x="1150" y="320" fill="#314730" font-size="30" font-family="Arial, sans-serif">3. Restore in Cursor</text>
  <rect x="1150" y="356" width="300" height="164" rx="16" fill="#F7FFF6" stroke="#A6C9A2"/>
  <text x="1174" y="400" fill="#365235" font-size="22" font-family="Courier New, monospace">list_recycle_bin()</text>
  <text x="1174" y="438" fill="#365235" font-size="22" font-family="Courier New, monospace">restore(...)</text>
  <text x="1174" y="476" fill="#365235" font-size="22" font-family="Courier New, monospace">confirmation_token</text>
  <text x="1174" y="514" fill="#365235" font-size="22" font-family="Courier New, monospace">restore(token=...)</text>

  <path d="M480 430H600" stroke="#A77A35" stroke-width="8" stroke-linecap="round"/>
  <path d="M580 410L620 430L580 450" stroke="#A77A35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M980 430H1100" stroke="#8C7A55" stroke-width="8" stroke-linecap="round"/>
  <path d="M1080 410L1120 430L1080 450" stroke="#8C7A55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
