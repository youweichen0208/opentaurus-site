<h2>配色方向选择</h2>
<p class="subtitle">Tavily 是深色基调。OpenTaurus 目前是浅色暖调。以下哪个方向最合适？</p>

<div class="options">
  <div class="option" data-choice="dark" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>全深色 — 类 Tavily</h3>
      <div style="display:flex;gap:8px;margin:12px 0;">
        <div style="width:40px;height:40px;border-radius:8px;background:#0a0a0a;border:1px solid rgba(255,255,255,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#141414;border:1px solid rgba(255,255,255,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#f97316;border:1px solid rgba(255,255,255,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#22c55e;border:1px solid rgba(255,255,255,0.1);"></div>
      </div>
      <p style="color:rgba(255,255,255,0.5);font-size:0.88rem;">背景接近黑色，文字高亮，按钮用品牌橙色。开发者氛围强，代码展示天然好看。</p>
    </div>
  </div>

  <div class="option" data-choice="light" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>浅色主体 + 深色代码区</h3>
      <div style="display:flex;gap:8px;margin:12px 0;">
        <div style="width:40px;height:40px;border-radius:8px;background:#fafafa;border:1px solid rgba(0,0,0,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#ffffff;border:1px solid rgba(0,0,0,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#f97316;border:1px solid rgba(0,0,0,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#0f172a;border:1px solid rgba(0,0,0,0.1);"></div>
      </div>
      <p style="color:rgba(255,255,255,0.5);font-size:0.88rem;">白色/浅灰背景，终端和代码卡片用深色，整体清新专业。类似 Vercel / Linear 风格。</p>
    </div>
  </div>

  <div class="option" data-choice="hybrid" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>深色 Hero + 浅色内容区</h3>
      <div style="display:flex;gap:8px;margin:12px 0;">
        <div style="width:40px;height:40px;border-radius:8px;background:#0a0a0a;border:1px solid rgba(255,255,255,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#fafafa;border:1px solid rgba(0,0,0,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#f97316;border:1px solid rgba(0,0,0,0.1);"></div>
        <div style="width:40px;height:40px;border-radius:8px;background:#1e293b;border:1px solid rgba(0,0,0,0.1);"></div>
      </div>
      <p style="color:rgba(255,255,255,0.5);font-size:0.88rem;">首页 Hero 用深色打造冲击力，下方内容区切回浅色保持可读性。Tavily 也用了类似策略。</p>
    </div>
  </div>
</div>
